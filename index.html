<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trokiva — liste d’attente</title>
  <meta name="description" content="Réserve ta place sur Trokiva, l’appli pour noter, donner et échanger des livres.">
  <meta name="theme-color" content="#0c0c0c">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="join">
  <div class="books" aria-hidden="true">
    <img class="book b1" src="assets/covers/alice.jpg" alt="">
    <img class="book b2" src="assets/covers/verne.jpg" alt="">
    <img class="book b3" src="assets/covers/sherlock.jpg" alt="">
    <img class="book b4" src="assets/covers/dracula.jpg" alt="">
    <img class="book b5" src="assets/covers/baskervilles.jpg" alt="">
    <img class="book b6" src="assets/covers/dracula-us.jpg" alt="">
  </div>
  <main class="stage">
    <p class="brand">Trokiva</p>
    <h1>Note, donne, <em>échange.</em></h1>
    <p class="sub">Réserve ta place sur Trokiva, l’appli pour noter, donner et échanger des livres.</p>
    <p class="invite" id="invite" hidden>Tu arrives avec une invitation.</p>
    <form class="card" id="join-form" novalidate>
      <label class="sr-only" for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ton@email.fr" aria-describedby="form-error" required>
      <button id="submit-btn" type="submit">Réserver</button>
      <p class="form-error" id="form-error" role="alert"></p>
    </form>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
